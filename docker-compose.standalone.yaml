# docker-compose for the STANDALONE local stack: a Hivemind that stays up
# while you develop. The dev stack (docker-compose.yaml) is the one the test
# suite uses — the integration tests TRUNCATE the database named by
# HIVEMIND_DATABASE_URL (default: the dev pool on :5432) — so this stack
# keeps its own database on its own port, named `hivemind_live`: a name
# tests/db_guard.py refuses to run the wiping suite against, so pointing a
# test run at this pool fails loudly instead of emptying it.
#
#   make standalone       -> start the whole standalone stack
#   make standalone-down  -> stop it
#   make standalone-reset -> stop it and wipe its data volume
#
# Ports (the dev set is 5432/8001/8000/8089/8088):
#   postgres  127.0.0.1:5433   db `hivemind_live`
#   vllm      127.0.0.1:8101
#   api       127.0.0.1:8100
#   admin     127.0.0.1:8189
#   mcp-http  :8188 (all interfaces; HIVEMIND_STANDALONE_MCP_HTTP_PORT overrides)
#
# Point agents / uv processes at it with:
#   HIVEMIND_DATABASE_URL=postgresql://hivemind:hivemind@localhost:5433/hivemind_live
#   HIVEMIND_API_URL=http://127.0.0.1:8100        (REST)
#   http://localhost:8188/mcp                     (streamable-HTTP MCP)
#
# Signing into the admin panel needs an admin key issued against THIS pool:
#   HIVEMIND_DATABASE_URL=postgresql://hivemind:hivemind@localhost:5433/hivemind_live \
#     uv run hivemind-keys issue-admin
#
# Same image and entrypoint as the dev stack; the entrypoint runs
# migrations before each runner (ADR 0018). Loopback only (DEP-7) except
# mcp-http, which remote agents must reach (put a TLS proxy in front).
# The compose project name is fixed to `hivemind-standalone` so its
# containers and volumes never collide with the dev stack's.
name: hivemind-standalone

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hivemind_live
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
    # Loopback only (DEP-7): default credentials are a local convenience.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hivemind-standalone-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Same local CPU embedding server as the dev stack (ADR 0005), on :8101.
  # Matryoshka dimensions and the 0.3 RAM fraction: see the dev compose.
  vllm:
    image: vllm/vllm-openai-cpu:v0.29.0-x86_64
    shm_size: "4g"
    command:
      - "--model"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--runner"
      - "pooling"
      - "--convert"
      - "embed"
      - "--hf-overrides"
      - '{"is_matryoshka": true, "matryoshka_dimensions": [32, 64, 128, 256, 512, 768, 1024]}'
      - "--gpu-memory-utilization"
      - "0.3"
    ports:
      - "127.0.0.1:8101:8000"
    volumes:
      - hivemind-standalone-vllm-cache:/root/.cache/huggingface

  # REST API (SPEC §5.1) against the standalone pool.
  api:
    build: .
    image: hivemind-api
    environment:
      HIVEMIND_RUNNER: api
      HIVEMIND_HOST: "0.0.0.0"
      HIVEMIND_PORT: "8000"
      HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind_live
      HIVEMIND_EMBEDDING_ENDPOINT: http://vllm:8000/v1
      HIVEMIND_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      HIVEMIND_EMBEDDING_DIM: "512"
      # Entity extraction (ADR 0016): off unless set in .env.
      HIVEMIND_EXTRACTOR_ENDPOINT: ${HIVEMIND_EXTRACTOR_ENDPOINT:-}
      HIVEMIND_EXTRACTOR_MODEL: ${HIVEMIND_EXTRACTOR_MODEL:-}
      HIVEMIND_EXTRACTOR_API_KEY: ${HIVEMIND_EXTRACTOR_API_KEY:-}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_started
    # Same rationale as the dev stack: worst request is the embedder leg
    # (3 x 10s + backoff, ADR 0014).
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Admin panel (ADR 0029) against the standalone REST API, on :8189.
  admin:
    build: .
    image: hivemind-admin
    environment:
      HIVEMIND_RUNNER: admin
      HIVEMIND_HOST: "0.0.0.0"
      HIVEMIND_PORT: "8080"
      HIVEMIND_ADMIN_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8189:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Streamable-HTTP MCP runner (ADR 0010) against the standalone pool.
  # Published on all interfaces (remote agents must reach it); override the
  # host port with HIVEMIND_STANDALONE_MCP_HTTP_PORT.
  mcp-http:
    build: .
    image: hivemind-mcp-http
    stop_grace_period: 35s
    environment:
      HIVEMIND_HOST: "0.0.0.0"
      HIVEMIND_PORT: "8088"
      HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind_live
      HIVEMIND_EMBEDDING_ENDPOINT: http://vllm:8000/v1
      HIVEMIND_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      HIVEMIND_EMBEDDING_DIM: "512"
      # Entity extraction (ADR 0016): off unless set in .env.
      HIVEMIND_EXTRACTOR_ENDPOINT: ${HIVEMIND_EXTRACTOR_ENDPOINT:-}
      HIVEMIND_EXTRACTOR_MODEL: ${HIVEMIND_EXTRACTOR_MODEL:-}
      HIVEMIND_EXTRACTOR_API_KEY: ${HIVEMIND_EXTRACTOR_API_KEY:-}
    ports:
      - "${HIVEMIND_STANDALONE_MCP_HTTP_PORT:-8188}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8088/mcp/health', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hivemind-standalone-pg-data:
  hivemind-standalone-vllm-cache:
