name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 8,15 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  # Pull requests: build only (proves the Dockerfile builds). Read-only token,
  # no registry login, no signing: a PR's Dockerfile is untrusted and must
  # never run with packages/id-token write scopes (DEP-13).
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  # Push / tag / schedule: build, publish and sign.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3
        with:
          # cosign v3 signs in the Sigstore bundle format and stores the
          # signature as an OCI 1.1 referring artifact (on GHCR, under the
          # `sha256-<digest>` referrers tag) instead of the old `.sig` tag.
          # Verify with cosign v3 (or v2.6+ with --new-bundle-format).
          cosign-release: 'v3.1.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx. The Dockerfile installs the
      # dependency set locked in uv.lock (`uv sync --locked`, which fails on
      # lock drift), and pins the base image by digest (bumped by
      # .github/dependabot.yml). A scheduled rebuild therefore repackages the
      # same inputs; it does not pick up new PyPI releases or a new base.
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest, keyless. The signing
      # certificate and the signature are recorded in the public Rekor
      # transparency log; cosign v3 takes the Fulcio and Rekor URLs from the
      # public-good instance's TUF signing config.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Release tags only (not pre-releases such as v1.2.3-rc.1): list the release
  # in the MCP Registry once its image is pushed (the registry reads the
  # image's io.modelcontextprotocol.server.name label). A separate job, so a
  # registry failure never undoes or blocks the image publish. Logs in with
  # this run's GitHub OIDC token; no stored secret.
  mcp-registry:
    needs: publish
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      REGISTRY_URL: https://registry.modelcontextprotocol.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check server.json matches the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          image="$(jq -r '.packages[0].identifier' server.json)"
          if [ "v${version}" != "${TAG}" ] || [ "${image##*:}" != "${TAG}" ]; then
            echo "::error::server.json has version ${version} and image ${image}, but the tag is ${TAG}"
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 30 --retry 3 --output /dev/null --write-out '%{http_code}' \
            "${REGISTRY_URL}/v0.1/servers/${name/\//%2F}/versions/${version}")"
          case "${status}" in
            200) echo "::notice::${name} ${version} is already in the MCP Registry; nothing to publish"
                 echo "publish=false" >> "${GITHUB_OUTPUT}" ;;
            404) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            *)   echo "::error::MCP Registry lookup returned HTTP ${status}"; exit 1 ;;
          esac

      - name: Install cosign
        if: steps.check.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # Pinned release, checked against its Sigstore bundle from the registry
      # project's own release workflow before it runs.
      - name: Download and verify mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base_url}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}.sigstore.json" "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${archive}"
          tar xzf "${archive}" mcp-publisher
          rm -f "${archive}" "${archive}.sigstore.json"

      - name: Publish to the MCP Registry
        if: steps.check.outputs.publish == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
