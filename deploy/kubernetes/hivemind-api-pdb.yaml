# PodDisruptionBudget for `hivemind-api` (ADR 0026).
#
# maxUnavailable governs ROLLOUTS only; `kubectl drain` / the eviction API
# consult only the PDB, so without one the last pod may be evicted.
# minAvailable: 1 at replicas: 2 sequences drains: a second drain waits
# until the first one's replacement is Ready.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hivemind-api
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: api
