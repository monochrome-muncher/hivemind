# DOCUMENTATION ONLY — this file is deliberately NOT listed in
# kustomization.yaml.
#
# The real `hivemind-secrets` Secret is rendered by the CI deploy job from
# the three masked + protected GitLab variables (see .gitlab-ci.yml + DEPLOY.md):
#
#   kubectl -n hivemind create secret generic hivemind-secrets \
#     --from-literal=HIVEMIND_DATABASE_URL="$K8S_SECRET_DATABASE_URL" \
#     --from-literal=HIVEMIND_EMBEDDING_API_KEY="$K8S_SECRET_EMBEDDING_API_KEY" \
#     --from-literal=HIVEMIND_EXTRACTOR_API_KEY="$K8S_SECRET_EXTRACTOR_API_KEY" \
#     --from-literal=HIVEMIND_MIGRATE_DATABASE_URL="${K8S_SECRET_MIGRATE_DATABASE_URL:-}" \
#     --dry-run=client -o yaml | kubectl -n hivemind apply -f -
#
# Empty values are allowed: an empty extractor key (with the empty
# extractor endpoint) means extraction OFF (ADR 0016); an empty embedding
# key suits an unauthenticated endpoint (self-hosted vLLM).
# HIVEMIND_MIGRATE_DATABASE_URL is optional: a direct DSN for
# `hivemind-migrate` when HIVEMIND_DATABASE_URL goes through a
# transaction-mode PgBouncer, which cannot hold the session advisory lock.
apiVersion: v1
kind: Secret
metadata:
  name: hivemind-secrets
  namespace: hivemind
type: Opaque
stringData:
  HIVEMIND_DATABASE_URL: ""
  HIVEMIND_EMBEDDING_API_KEY: ""
  HIVEMIND_EXTRACTOR_API_KEY: ""
  HIVEMIND_MIGRATE_DATABASE_URL: ""
