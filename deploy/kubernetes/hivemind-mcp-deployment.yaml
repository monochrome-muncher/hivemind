# Hostable streamable-HTTP MCP runner (ADR 0010): the `hivemind-mcp-http`
# console script, serving any number of agents, each authenticating per
# request with its own agent-scoped key. ADR 0010's invariant is the SHARED
# pool (never a process per agent); 2 replicas for availability (ADR 0026).
#
# Image contract (Dockerfile): entrypoint /app/entrypoint.sh runs
# hivemind-"${HIVEMIND_RUNNER:-mcp-http}" "$@"; this pod sets
# HIVEMIND_RUNNER=mcp-http. `hivemind:0.0.0` is the single sed target the CI
# deploy job replaces with $K8S_IMAGE:$CI_COMMIT_SHORT_SHA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-mcp
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: mcp
spec:
  # Two replicas for AVAILABILITY, not throughput (ADR 0026; see
  # hivemind-api). Safe because the transport is STATELESS streamable-HTTP
  # (ADR 0010, SPEC §8.5) and credentials resolve per request, so either
  # replica answers any request. Still one Postgres node (ADR 0007 / 0026).
  replicas: 2
  # Explicit: the 25% defaults match only at replicas: 2 (see hivemind-api).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: mcp
    spec:
      # The entrypoint runs the idempotent migration (ADR 0013) before the
      # runner (ADR 0018: no init container). A dim mismatch (ADR 0015) or an
      # unreachable DB fails it LOUDLY and the pod crash-loops; the restart
      # policy owns recovery.

      # Graceful shutdown. The transport is stateless (one request = one
      # self-contained exchange, no session registry), so a terminating pod
      # risks at most ONE in-flight tool call, never a client session.
      #
      # 1. terminationGracePeriodSeconds: uvicorn drains in-flight requests
      #    on SIGTERM with no deadline of its own, so THIS is the only real
      #    deadline. It must cover the slowest request, a write, which embeds
      #    then extracts, each with bounded retries (ADR 0014):
      #
      #      embedder   3 attempts x 10s (HIVEMIND_EMBEDDING_TIMEOUT's
      #                 default) + 0.5s + 1.0s backoff =            31.5s
      #      extractor  3 attempts x 30s + 0.5s + 1.0s backoff =  91.5s
      #      ------------------------------------------------- -------
      #      worst-case write path                               123.0s
      #
      #    Plus the 5s preStop sleep and two Postgres round-trips, rounded
      #    up to 150s (httpx times out PER I/O phase, so one attempt can run
      #    longer). Matches the startupProbe budget.
      #
      #    RAISE THIS if HIVEMIND_EXTRACTOR_RETRIES, HIVEMIND_EXTRACTOR_TIMEOUT,
      #    HIVEMIND_EMBEDDING_RETRIES or HIVEMIND_EMBEDDING_TIMEOUT go up
      #    (DEPLOY.md §5).
      terminationGracePeriodSeconds: 150
      # No service-link variables: hivemind-* Services would otherwise inject
      # HIVEMIND_*_SERVICE_HOST / _PORT into the env (ADR 0032).
      enableServiceLinks: false
      # Hardening (DEP-4): non-root UID matching the image's USER,
      # RuntimeDefault seccomp, no ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Prefer different nodes (DEP-12): the PDB covers only voluntary
      # drains. ScheduleAnyway keeps single-node clusters working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hivemind
              app.kubernetes.io/component: mcp

      containers:
        - name: app
          image: hivemind:0.0.0
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          env:
            # The entrypoint execs `hivemind-mcp-http` (ADR 0010); port 8088
            # as in compose.
            - name: HIVEMIND_RUNNER
              value: "mcp-http"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8088"
          # 2. preStop: SIGTERM and EndpointSlice removal happen concurrently,
          #    so kube-proxy and the nginx ingress (which routes to pod IPs)
          #    may still send NEW requests after uvicorn closed its listener.
          #    The sleep (inside the grace period) lets deregistration win.
          #    /bin/sleep, not the native `sleep` handler (k8s 1.30+ only).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # The app writes nothing to disk: read-only root, emptyDir /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # MEASURE-and-adjust defaults (DEP-5). Requests give Burstable QoS
          # (BestEffort is evicted first); the memory limit bounds a runaway
          # request; no CPU limit, so no throttling. Each pod holds up to
          # 2 x HIVEMIND_POOL_MAX_SIZE Postgres connections: size together.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8088
          # Probe endpoints are unauthenticated (ADRs 0019, 0037);
          # /mcp/liveness and /mcp/health are shallow. Readiness deliberately
          # skips the DB: every replica shares it, so an outage would pull
          # them all at once. /mcp/health/database is the deep check (for
          # people and monitoring, no probe). Startup gate (ADR 0020): the
          # entrypoint migrates BEFORE listening, so 30 x 5s = up to 150s.
          startupProbe:
            httpGet:
              path: /mcp/liveness
              port: 8088
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /mcp/liveness
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: 8088
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
