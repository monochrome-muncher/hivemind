# Hostable streamable-HTTP MCP runner (ADR 0010) — the `hivemind-mcp-http`
# console script: ONE long-lived process serving an unlimited number of
# agents, each authenticating per request with its own agent-scoped key.
#
# Image contract (shipped by the generic Dockerfile lane):
#   * entrypoint /app/entrypoint.sh:  exec hivemind-"${HIVEMIND_RUNNER:-mcp-http}" "$@"
#   * the pod sets HIVEMIND_RUNNER=mcp-http and passes args via the pod `args:` field
#   * the placeholder image `hivemind:0.0.0` is the single sed target the CI
#     deploy job replaces with $K8S_IMAGE:$CI_COMMIT_SHORT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-mcp
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: mcp
spec:
  # Single-node decision (ADR 0007) — one runner process (see hivemind-api).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: mcp
    spec:
      # The image entrypoint runs the idempotent schema migration (ADR 0013)
      # before starting the runner (ADR 0018 — no init container: single
      # source of truth). A dim mismatch (ADR 0015) or an unreachable DB
      # fails the first entrypoint step LOUDLY: the pod never serves
      # (crash-loops until the DB is up — the desired posture; no retry in
      # the entrypoint, the pod restart policy owns recovery).
      containers:
        - name: app
          image: hivemind:0.0.0
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          env:
            # The entrypoint execs `hivemind-mcp-http` (ADR 0010). The host-
            # port mapping in compose uses 8088; keep the same convention.
            - name: HIVEMIND_RUNNER
              value: "mcp-http"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8088"
          ports:
            - name: http
              containerPort: 8088
          # Unauthenticated probe endpoints (ADR 0019): /mcp/liveness is
          # shallow (200 = the process answers); /mcp/health is deep (200
          # only when the DB pool answers, else 503 — a transient DB
          # outage marks the pod NotReady without restarting it). Probes
          # carry no credential: these paths are served outside the auth
          # middleware.
          livenessProbe:
            httpGet:
              path: /mcp/liveness
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: 8088
            initialDelaySeconds: 3
            periodSeconds: 5