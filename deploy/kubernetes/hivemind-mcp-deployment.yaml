# Hostable streamable-HTTP MCP runner (ADR 0010) — the `hivemind-mcp-http`
# console script: long-lived processes each serving an unlimited number
# of agents, every one authenticating per request with its own
# agent-scoped key. ADR 0010's invariant is the SHARED pool (never a
# process per agent), not a single process — this Deployment runs 2
# interchangeable replicas of it for availability (ADR 0026).
#
# Image contract (shipped by the generic Dockerfile lane):
#   * entrypoint /app/entrypoint.sh:  exec hivemind-"${HIVEMIND_RUNNER:-mcp-http}" "$@"
#   * the pod sets HIVEMIND_RUNNER=mcp-http and passes args via the pod `args:` field
#   * the placeholder image `hivemind:0.0.0` is the single sed target the CI
#     deploy job replaces with $K8S_IMAGE:$CI_COMMIT_SHORT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-mcp
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: mcp
spec:
  # Two replicas for AVAILABILITY, not throughput (ADR 0026, which
  # supersedes ADR 0007's one-process clause; see hivemind-api for the
  # same reasoning). Safe here because the transport is STATELESS
  # streamable-HTTP (ADR 0010, SPEC §8.5) and the credential is resolved
  # per request, so either replica answers any request identically.
  # "One process, many agents" (ADR 0010) becomes "one shared pool per
  # process, many agents" — no process is ever per-agent.
  # One Postgres node is UNCHANGED (ADR 0007 / ADR 0026).
  replicas: 2
  # Explicit for the same reason as on hivemind-api: the 25% defaults
  # coincide at replicas: 2 and diverge above it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: mcp
    spec:
      # The image entrypoint runs the idempotent schema migration (ADR 0013)
      # before starting the runner (ADR 0018 — no init container: single
      # source of truth). A dim mismatch (ADR 0015) or an unreachable DB
      # fails the first entrypoint step LOUDLY: the pod never serves
      # (crash-loops until the DB is up — the desired posture; no retry in
      # the entrypoint, the pod restart policy owns recovery).

      # Graceful shutdown on rolling deploys. With more than one replica a
      # rolling deploy terminates pods routinely, so this is ordinary
      # traffic, not an edge case. The transport is STATELESS
      # streamable-HTTP (ADR 0010, SPEC §8.5: one request = one
      # self-contained exchange; the SDK builds a fresh transport per
      # request and the server holds no session registry), so a
      # terminating pod's blast radius is at most ONE in-flight tool
      # call — never a client session. Two separate concerns, one here
      # and one below:
      #
      # 1. terminationGracePeriodSeconds — the SIGTERM -> SIGKILL budget.
      #    uvicorn handles SIGTERM itself (stop accepting, drain the
      #    in-flight requests, THEN run the lifespan shutdown), and
      #    nothing sets uvicorn's `timeout_graceful_shutdown`, so its own
      #    wait is unbounded: THIS number is the only real deadline.
      #    It must therefore cover the slowest single request, which is a
      #    write (`hive_write` / `POST /v1/entries`): `WriteService.write`
      #    embeds and then extracts, in sequence, each with its own
      #    bounded retry budget (ADR 0014).
      #
      #      embedder   3 attempts x 10s + 0.5s + 1.0s backoff =  31.5s
      #      extractor  3 attempts x 30s + 0.5s + 1.0s backoff =  91.5s
      #      ------------------------------------------------- -------
      #      worst-case write path                               123.0s
      #
      #    Plus the 5s preStop sleep below and two pooled Postgres
      #    round-trips (auth verify + INSERT), rounded up to 150s for
      #    margin — httpx applies its timeout PER I/O phase (connect /
      #    read / write), so a single attempt can exceed it. 150s is also
      #    the budget the startupProbe already gets.
      #
      #    RAISE THIS if HIVEMIND_EXTRACTOR_RETRIES or
      #    HIVEMIND_EXTRACTOR_TIMEOUT (or HIVEMIND_EMBEDDING_RETRIES) go
      #    up — DEPLOY.md §5 carries the arithmetic and the recipe.
      terminationGracePeriodSeconds: 150

      containers:
        - name: app
          image: hivemind:0.0.0
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          env:
            # The entrypoint execs `hivemind-mcp-http` (ADR 0010). The host-
            # port mapping in compose uses 8088; keep the same convention.
            - name: HIVEMIND_RUNNER
              value: "mcp-http"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8088"
          # 2. preStop — the endpoint-deregistration race. On pod deletion
          #    the kubelet's SIGTERM and the EndpointSlice removal happen
          #    CONCURRENTLY, so for as long as that removal takes to reach
          #    kube-proxy (and the nginx ingress controller, which routes
          #    straight to pod IPs, bypassing the Service) a terminating
          #    pod can still be handed NEW requests — which it would
          #    refuse, because uvicorn has already closed its listener.
          #    Sleeping lets deregistration win the race: the process
          #    keeps serving normally throughout, it just is not asked to
          #    exit yet. The sleep runs INSIDE the grace period above.
          #    `sleep` is /bin/sleep from the python:3.14-slim base —
          #    deliberately NOT the native `sleep` lifecycle handler
          #    (GA only in k8s 1.30+), so this works on older clusters.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8088
          # Unauthenticated probe endpoints (ADR 0019): /mcp/liveness is
          # shallow (200 = the process answers); /mcp/health is deep (200
          # only when the DB pool answers, else 503 — a transient DB
          # outage marks the pod NotReady without restarting it). Probes
          # carry no credential: these paths are served outside the auth
          # middleware.
          # Startup gate (ADR 0020): the entrypoint applies the migration
          # chain BEFORE the server listens, so k8s must not kill a pod
          # that is still migrating. Liveness/readiness are suspended
          # until this succeeds; 30 x 5s = up to 150s for a slow index
          # build on a large pool, then a normal restart.
          startupProbe:
            httpGet:
              path: /mcp/liveness
              port: 8088
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /mcp/liveness
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: 8088
            initialDelaySeconds: 3
            periodSeconds: 5