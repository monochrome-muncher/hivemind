# FIRST-RUN KEY BOOTSTRAP Job (DEP-1, DEP-9) — applied by
# scripts/ci-bootstrap-keys.sh from the GitLab deploy job, ONLY while the
# `hivemind-keys` Secret does not exist. Deliberately NOT part of any
# kustomization: it is a one-shot, and the placeholder image
# `hivemind:0.0.0` is substituted by the script, like the Deployments.
#
# On a FRESH database no admin / org keys exist. This Job migrates the
# schema (idempotent, ADR 0013), then `hivemind-keys bootstrap-secret`
# issues the first admin key, rotates the org key and writes both raw keys
# straight into the `hivemind-keys` Secret through the Kubernetes API
# (ADR 0044). NO KEY IS EVER PRINTED: the pod log holds only status lines,
# so a cluster log shipper never captures a key.
#
#   * envFrom carries BOTH hivemind-secrets (DSN) and hivemind-config, so
#     `hivemind-migrate` provisions a fresh pool at the operator's
#     HIVEMIND_EMBEDDING_DIM, not the code default (ADR 0015).
#   * serviceAccountName: the Job's own ServiceAccount (rbac.yaml), the only
#     workload that mounts a token. Its Role can create Secrets and get /
#     delete `hivemind-keys`, nothing else; the CI script removes the RBAC
#     objects again once the Job has finished.
#   * The keys are issued in one database transaction that commits only
#     after the Secret was created, so a failed run leaves nothing behind
#     and can be re-run. backoffLimit stays 0 so a failure surfaces in CI.
#   * ttlSecondsAfterFinished — the cluster deletes the Job shortly after it
#     finishes even if the CI job died before cleaning up.
apiVersion: batch/v1
kind: Job
metadata:
  name: hivemind-keys-bootstrap
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: keys-bootstrap
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: keys-bootstrap
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      serviceAccountName: hivemind-keys-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keys
          image: hivemind:0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          command:
            - sh
            - -c
            - |
              set -eu
              # A FRESH database has no schema yet (the Deployments'
              # entrypoints only migrate after this Job): create it first so
              # the credentials table exists; a cheap no-op on an existing DB.
              hivemind-migrate
              # Issues both keys into the hivemind-keys Secret; prints neither.
              hivemind-keys --actor ci-bootstrap bootstrap-secret --secret hivemind-keys
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
