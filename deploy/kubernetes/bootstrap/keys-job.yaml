# FIRST-RUN KEY BOOTSTRAP Job (DEP-1, DEP-9), applied by
# scripts/ci-bootstrap-keys.sh ONLY while the `hivemind-keys` Secret does
# not exist. Not in any kustomization (one-shot); the script substitutes
# the `hivemind:0.0.0` placeholder.
#
# It migrates (idempotent, ADR 0013), then `hivemind-keys bootstrap-secret`
# issues the first admin key, rotates the org key and writes both into the
# `hivemind-keys` Secret via the Kubernetes API (ADR 0044). NO KEY IS EVER
# PRINTED, so log shippers never capture one.
#
#   * envFrom includes hivemind-config so a fresh pool gets the operator's
#     HIVEMIND_EMBEDDING_DIM, not the code default (ADR 0015).
#   * Its own ServiceAccount (rbac.yaml), the only workload with a token:
#     create Secrets, get / delete `hivemind-keys`, nothing else. The CI
#     script removes the RBAC objects afterwards.
#   * The key transaction commits only after the Secret exists, so a failed
#     run leaves nothing and can be re-run. backoffLimit 0 surfaces failures
#     in CI.
#   * ttlSecondsAfterFinished cleans up even if the CI job died.
apiVersion: batch/v1
kind: Job
metadata:
  name: hivemind-keys-bootstrap
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: keys-bootstrap
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: keys-bootstrap
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      serviceAccountName: hivemind-keys-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keys
          image: hivemind:0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          command:
            - sh
            - -c
            - |
              set -eu
              # A FRESH database has no schema yet (the Deployments'
              # entrypoints only migrate after this Job): create it first so
              # the credentials table exists; a cheap no-op on an existing DB.
              hivemind-migrate
              # Issues both keys into the hivemind-keys Secret; prints neither.
              hivemind-keys --actor ci-bootstrap bootstrap-secret --secret hivemind-keys
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
