# RBAC for the first-run key bootstrap Job (ADR 0044), applied and removed
# by scripts/ci-bootstrap-keys.sh around the Job; not in any kustomization.
#
# The Job writes the keys into the Secret, so it needs exactly:
#   * create Secrets (`create` cannot be narrowed by name; the Job only
#     creates `hivemind-keys`),
#   * get `hivemind-keys` (idempotency) and delete it (cleanup when the DB
#     commit fails after the Secret was created).
# The deploy identity needs the same Secret permissions to create this Role
# (RBAC escalation check); it already creates `hivemind-secrets`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hivemind-keys-bootstrap
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: keys-bootstrap
# Only the Job's pod (which opts in) mounts a token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hivemind-keys-bootstrap
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: keys-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hivemind-keys"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hivemind-keys-bootstrap
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: keys-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hivemind-keys-bootstrap
subjects:
  - kind: ServiceAccount
    name: hivemind-keys-bootstrap
    # Rewritten by scripts/ci-bootstrap-keys.sh when NAMESPACE is not hivemind.
    namespace: hivemind
