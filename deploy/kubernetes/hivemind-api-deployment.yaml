# REST API surface (SPEC §5.1): the `hivemind-api` console script.
#
# Image contract (Dockerfile): entrypoint /app/entrypoint.sh runs
# hivemind-"${HIVEMIND_RUNNER:-mcp-http}" "$@"; this pod sets
# HIVEMIND_RUNNER=api. `hivemind:0.0.0` is the single sed target the CI
# deploy job replaces with $K8S_IMAGE:$CI_COMMIT_SHORT_SHA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-api
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: api
spec:
  # Two replicas for AVAILABILITY, not throughput (ADR 0026): the tier is
  # I/O-bound, so a second replica buys zero-downtime deploys and node-drain
  # survival, not capacity. Still one Postgres node (ADR 0007 / ADR 0026).
  replicas: 2
  # Explicit because k8s' 25% defaults match only at replicas: 2.
  # maxUnavailable: 0 = the new pod is Ready BEFORE the old one leaves.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: api
      # Prometheus scrape target (ADR 0050): GET /metrics on the app port,
      # scraped per pod; the public Ingress never serves /metrics.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # The entrypoint runs the idempotent migration (ADR 0013) before the
      # runner (ADR 0018: no init container). A dim mismatch (ADR 0015) or an
      # unreachable DB fails it LOUDLY and the pod crash-loops; the restart
      # policy owns recovery.

      # Graceful shutdown (rolling deploys terminate pods routinely; REST
      # holds no session state, so only in-flight requests are at risk).
      #
      # 1. terminationGracePeriodSeconds: uvicorn drains in-flight requests
      #    on SIGTERM with no deadline of its own, so THIS is the only real
      #    deadline. It must cover the slowest request, a write, which embeds
      #    then extracts, each with bounded retries (ADR 0014):
      #
      #      embedder   3 attempts x 10s (HIVEMIND_EMBEDDING_TIMEOUT's
      #                 default) + 0.5s + 1.0s backoff =            31.5s
      #      extractor  3 attempts x 30s + 0.5s + 1.0s backoff =  91.5s
      #      ------------------------------------------------- -------
      #      worst-case write path                               123.0s
      #
      #    Plus the 5s preStop sleep and two Postgres round-trips, rounded
      #    up to 150s (httpx times out PER I/O phase, so one attempt can run
      #    longer). Matches the startupProbe budget.
      #
      #    RAISE THIS if HIVEMIND_EXTRACTOR_RETRIES, HIVEMIND_EXTRACTOR_TIMEOUT,
      #    HIVEMIND_EMBEDDING_RETRIES or HIVEMIND_EMBEDDING_TIMEOUT go up
      #    (DEPLOY.md §5).
      terminationGracePeriodSeconds: 150
      # No service-link variables: hivemind-* Services would otherwise inject
      # HIVEMIND_*_SERVICE_HOST / _PORT into the env (ADR 0032).
      enableServiceLinks: false
      # Hardening (DEP-4): non-root UID matching the image's USER,
      # RuntimeDefault seccomp, no ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Prefer different nodes (DEP-12): the PDB covers only voluntary
      # drains. ScheduleAnyway keeps single-node clusters working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hivemind
              app.kubernetes.io/component: api

      containers:
        - name: app
          image: hivemind:0.0.0
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          env:
            # The entrypoint execs `hivemind-api` (REST, SPEC §5.1).
            - name: HIVEMIND_RUNNER
              value: "api"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8000"
          # 2. preStop: SIGTERM and EndpointSlice removal happen concurrently,
          #    so kube-proxy and the nginx ingress (which routes to pod IPs)
          #    may still send NEW requests after uvicorn closed its listener.
          #    The sleep (inside the grace period) lets deregistration win.
          #    /bin/sleep, not the native `sleep` handler (k8s 1.30+ only).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # The app writes nothing to disk: read-only root, emptyDir /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # MEASURE-and-adjust defaults (DEP-5). Requests give Burstable QoS
          # (BestEffort is evicted first); the memory limit bounds a runaway
          # request; no CPU limit, so no throttling. Each pod holds up to
          # 2 x HIVEMIND_POOL_MAX_SIZE Postgres connections: size together.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8000
          # Probe endpoints are unauthenticated (ADR 0019); /v1/liveness is
          # shallow. Startup gate (ADR 0020): the entrypoint migrates BEFORE
          # listening, so 30 x 5s = up to 150s before a restart.
          startupProbe:
            httpGet:
              path: /v1/liveness
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: /v1/health is a STATIC 200 (SPEC §5.1); a DB outage
          # shows as request errors, not NotReady. The deep DB check is on
          # the MCP runner (/mcp/health/database, ADR 0037).
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
