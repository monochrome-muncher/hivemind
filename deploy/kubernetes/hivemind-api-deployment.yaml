# REST API surface (SPEC §5.1) — the `hivemind-api` console script.
#
# Image contract (shipped by the generic Dockerfile lane):
#   * entrypoint /app/entrypoint.sh:  exec hivemind-"${HIVMIND_RUNNER:-mcp-http}" "$@"
#   * the pod sets HIVEMIND_RUNNER=api and passes args via the pod `args:` field
#   * the placeholder image `hivemind:0.0.0` is the single sed target the CI
#     deploy job replaces with the real registry image ($K8S_IMAGE:$CI_COMMIT_SHORT_SHA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-api
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: api
spec:
  # Two replicas for AVAILABILITY, not throughput (ADR 0026, which
  # supersedes ADR 0007's one-process clause). The app tier is I/O-bound
  # — a request waits on the embedder, the extractor and Postgres — so a
  # second replica adds no capacity to any of those; what it buys is a
  # zero-downtime rolling deploy and a pod that survives a node drain.
  # One Postgres node is UNCHANGED (ADR 0007 / ADR 0026).
  replicas: 2
  # Written down explicitly even though k8s' own 25% defaults round to
  # the same numbers at replicas: 2 — at 3 or 4 they do not, so the
  # guarantee would silently weaken if this count is ever raised.
  # maxUnavailable: 0 = the new pod passes readiness BEFORE the old one
  # is asked to leave (a handover, not a gap).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: api
    spec:
      # The image entrypoint runs the idempotent schema migration (ADR 0013)
      # before starting the runner (`hivemind-api`) (ADR 0018 — no init
      # container: single source of truth). A dim mismatch (ADR 0015) or an
      # unreachable DB fails the first entrypoint step LOUDLY: the pod never
      # serves (crash-loops until the DB is up — the desired posture; no
      # retry in the entrypoint, the pod restart policy owns recovery).

      # Graceful shutdown on rolling deploys. With more than one replica a
      # rolling deploy terminates pods routinely, so this is ordinary
      # traffic, not an edge case. The REST surface is plain
      # request/response (SPEC §5.1) — no server-side session state — so
      # a terminating pod's blast radius is at most the requests already
      # in flight on it. Two separate concerns, one here and one below:
      #
      # 1. terminationGracePeriodSeconds — the SIGTERM -> SIGKILL budget.
      #    uvicorn handles SIGTERM itself (stop accepting, drain the
      #    in-flight requests, THEN run the lifespan shutdown), and
      #    nothing sets uvicorn's `timeout_graceful_shutdown`, so its own
      #    wait is unbounded: THIS number is the only real deadline.
      #    It must therefore cover the slowest single request, which is a
      #    write (`hive_write` / `POST /v1/entries`): `WriteService.write`
      #    embeds and then extracts, in sequence, each with its own
      #    bounded retry budget (ADR 0014).
      #
      #      embedder   3 attempts x 10s (HIVEMIND_EMBEDDING_TIMEOUT's
      #                 default) + 0.5s + 1.0s backoff =            31.5s
      #      extractor  3 attempts x 30s + 0.5s + 1.0s backoff =  91.5s
      #      ------------------------------------------------- -------
      #      worst-case write path                               123.0s
      #
      #    Plus the 5s preStop sleep below and two pooled Postgres
      #    round-trips (auth verify + INSERT), rounded up to 150s for
      #    margin — httpx applies its timeout PER I/O phase (connect /
      #    read / write), so a single attempt can exceed it. 150s is also
      #    the budget the startupProbe already gets.
      #
      #    RAISE THIS if HIVEMIND_EXTRACTOR_RETRIES, HIVEMIND_EXTRACTOR_TIMEOUT,
      #    HIVEMIND_EMBEDDING_RETRIES or HIVEMIND_EMBEDDING_TIMEOUT go up —
      #    DEPLOY.md §5 carries the arithmetic and the recipe.
      terminationGracePeriodSeconds: 150
      # No Kubernetes service-link variables: every Service named
      # hivemind-* would otherwise inject HIVEMIND_*_SERVICE_HOST /
      # _PORT variables into this pod (ADR 0032). Hivemind finds its
      # peers by DNS name, never through these.
      enableServiceLinks: false

      containers:
        - name: app
          image: hivemind:0.0.0
          envFrom:
            - configMapRef:
                name: hivemind-config
            - secretRef:
                name: hivemind-secrets
          env:
            # The entrypoint execs `hivemind-api` (REST, SPEC §5.1).
            - name: HIVEMIND_RUNNER
              value: "api"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8000"
          # 2. preStop — the endpoint-deregistration race. On pod deletion
          #    the kubelet's SIGTERM and the EndpointSlice removal happen
          #    CONCURRENTLY, so for as long as that removal takes to reach
          #    kube-proxy (and the nginx ingress controller, which routes
          #    straight to pod IPs, bypassing the Service) a terminating
          #    pod can still be handed NEW requests — which it would
          #    refuse, because uvicorn has already closed its listener.
          #    Sleeping lets deregistration win the race: the process
          #    keeps serving normally throughout, it just is not asked to
          #    exit yet. The sleep runs INSIDE the grace period above.
          #    `sleep` is /bin/sleep from the python:3.14-slim base —
          #    deliberately NOT the native `sleep` lifecycle handler
          #    (GA only in k8s 1.30+), so this works on older clusters.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8000
          # Unauthenticated probe endpoints (ADR 0019): /v1/liveness is
          # shallow (200 = the process answers). Probes carry no credential:
          # these paths are served outside the auth middleware.
          # Startup gate (ADR 0020): the entrypoint applies the migration
          # chain BEFORE the server listens, so k8s must not kill a pod
          # that is still migrating. Liveness/readiness are suspended
          # until this succeeds; 30 x 5s = up to 150s for a slow index
          # build on a large pool, then a normal restart.
          startupProbe:
            httpGet:
              path: /v1/liveness
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: /v1/health is a STATIC 200 (public by design, SPEC
          # §5.1 — the REST surface has no deep DB-probe endpoint in v1: a
          # DB outage shows as request errors, not NotReady). The deep DB
          # probe lives on the MCP runner (/mcp/health, ADR 0019).
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5