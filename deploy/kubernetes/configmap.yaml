# Non-secret configuration baseline (HIVEMIND_* keys, see src/hivemind/config.py).
#
# An omitted key falls back to the Settings default. The DSN and the
# embedding / extractor API keys live in the `hivemind-secrets` Secret, NOT
# here (see secret-template.yaml).
#
# HIVEMIND_RUNNER/HOST/PORT are set on the Deployments; they are not
# Settings fields (`_ALLOWED_EXTRA_ENV_VARS` in config.py). Any other
# unknown HIVEMIND_* variable is logged as a WARNING at startup (ADR 0024),
# so typos surface; it fails startup only with HIVEMIND_STRICT_ENV=true
# (ADR 0032).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hivemind-config
data:
  # --- embeddings (ADR 0005: deploy-time decision) ---------------------------
  # Placeholder: point at the in-cluster vLLM (or any OpenAI-compatible)
  # embedding Service.
  HIVEMIND_EMBEDDING_ENDPOINT: "http://vllm:8000/v1"
  # The model name recorded per entry (provenance, ADR 0005).
  HIVEMIND_EMBEDDING_MODEL: "Qwen/Qwen3-Embedding-0.6B"
  # Code default 1024 (ADR 0015). Must match the pool's dim, or the
  # entrypoint migration (ADR 0018) fails LOUDLY and the pod never serves.
  HIVEMIND_EMBEDDING_DIM: "1024"
  # Bounded body prefix for embedding + extraction (SPEC §7), counted in
  # whitespace-delimited words, not model tokens (ADR 0021).
  HIVEMIND_EMBEDDING_PREFIX_TOKENS: "2000"
  # Retry budget for transient embedder failures (ADR 0014); 0 disables.
  HIVEMIND_EMBEDDING_RETRIES: "2"
  # Overall per-call deadline (ADR 0041): UNSET = derived from the timeout and
  # retries (the DEPLOY.md §5 worst case), so raising RETRIES/TIMEOUT just
  # works. Set HIVEMIND_EMBEDDING_DEADLINE / HIVEMIND_EXTRACTOR_DEADLINE only
  # to cap lower; a value below the per-attempt timeout fails startup.
  # --- entity extraction (ADR 0016: optional + best-effort) ------------------
  # EMPTY endpoint = extraction OFF (no LLM cost; empty `entities`). To
  # enable, set endpoint + model here and the key via the GitLab variable
  # K8S_SECRET_EXTRACTOR_API_KEY (CI renders it into hivemind-secrets).
  HIVEMIND_EXTRACTOR_ENDPOINT: ""
  HIVEMIND_EXTRACTOR_MODEL: ""
  # Chat-call timeout (seconds) + retry budget (ADR 0014 pattern).
  HIVEMIND_EXTRACTOR_TIMEOUT: "30.0"
  HIVEMIND_EXTRACTOR_RETRIES: "2"
  # --- retrieval knobs (mirror SearchConfig defaults, SPEC §6.2/§6.4) --------
  HIVEMIND_RRF_K: "60"
  HIVEMIND_WEIGHT_KEYWORD: "0.5"
  HIVEMIND_WEIGHT_VECTOR: "0.5"
  HIVEMIND_CANDIDATE_TOP_K: "20"
  HIVEMIND_DEFAULT_LIMIT: "10"
  HIVEMIND_HALF_LIFE_DAYS: "30.0"
  # Recency factor floor (ADR 0022): max(floor, 0.5 ** (age / half_life)),
  # a 1.25x range at 0.8, inside RRF's 2.62x fused range so match quality
  # stays the sort key. A BAND, NOT A SLIDER: 0.9 measured worse than no
  # decay, 1.0 *is* off, below 0.381 it does nothing. "" or "none" = the
  # unbounded pre-ADR-0022 behaviour (ADR 0023).
  HIVEMIND_RECENCY_FLOOR: "0.8"
  # Search similarity threshold (ADRs 0062, 0100): 0.45 when unset, measured
  # for Qwen3-Embedding. "" or "none" turns it off. For another embedder,
  # measure with `make measure-threshold` first.
  # HIVEMIND_VECTOR_MIN_SIMILARITY: "0.45"
  # Task line put before the search query for an instruction-aware embedder
  # such as Qwen3-Embedding (ADR 0097). On by default with "Given an agent's
  # task or question, retrieve shared memory entries that answer it". Set it
  # to "" to turn it off, for example with a non-Qwen embedder; with a
  # different embedder, measure with `make measure-query-instruction`.
  # HIVEMIND_QUERY_INSTRUCTION: ""
  # Read-time grouping of unlinked versions of one fact (ADR 0074), off when
  # unset. Model-specific: measure with `make measure-versions` first.
  # HIVEMIND_VERSION_GROUP_MIN_SIMILARITY: ""
  HIVEMIND_QUALITY_HELPFUL_WEIGHT: "0.2"
  HIVEMIND_QUALITY_STALE_WEIGHT: "0.4"
  HIVEMIND_QUALITY_WRONG_WEIGHT: "1.0"
  HIVEMIND_QUALITY_PRIOR: "2"
  HIVEMIND_QUALITY_MIN: "0.5"
  HIVEMIND_QUALITY_MAX: "1.2"
  HIVEMIND_SOCIAL_MAX: "1.2"
  # Relevance weight of an opt-in explore search's MMR re-ordering (ADR
  # 0078), in (0, 1]; 1 = relevance order. Searches without explore ignore it.
  HIVEMIND_EXPLORE_LAMBDA: "0.7"
  # A "last confirmed" date restarts the recency clock for the upside (ADR
  # 0071); off until measured with the deployment's embedder.
  HIVEMIND_RECENCY_FROM_CONFIRMATION: "false"
  # A recency half-life per kind, e.g. "insight=180,decision=365" (ADR 0072);
  # empty = one curve for all kinds. Off until measured with the deployment's
  # embedder.
  HIVEMIND_RECENCY_BY_KIND: ""
  # A search may carry a `recency` hint (prefer_recent, ignore_age; ADR
  # 0073). On by default (ADR 0101); "false": accepted and ignored.
  HIVEMIND_RECENCY_HINT: "true"
  # Narrow the importance factor to 0.9..1.1 so one importance step stays
  # below the social cap (ADR 0088). On by default; "false" restores
  # 0.6..1.0.
  HIVEMIND_NARROW_IMPORTANCE: "true"
  # Seconds the usage report (/v1/metrics, /metrics) reuses its grouped
  # scan of the entries (ADR 0069); entry counts can be that old. 0 = off.
  HIVEMIND_METRICS_ENTRY_COUNTS_TTL: "300"
  # --- MCP-HTTP Host/Origin guard (ADR 0042; default: SDK behaviour, off on 0.0.0.0) ---
  # Uncomment with the public Host header your ingress forwards to enforce it.
  # HIVEMIND_MCP_ALLOWED_HOSTS: "hivemind.example.com"
  # HIVEMIND_MCP_ALLOWED_ORIGINS: ""
  # --- credentials (ADR 0082) -----------------------------------------------
  # Require stored keys: a dev-mode credential (one that is not an admin
  # key, an org key, or an active agent's key) sits at trust level 0 on the
  # data plane. True in production, so a keyless script or custom runner can
  # no longer read everything and write `org` under a placeholder author.
  HIVEMIND_REQUIRE_STORED_KEYS: "true"
