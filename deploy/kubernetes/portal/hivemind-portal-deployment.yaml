# Agent portal (ADR 0095): the `hivemind-portal` console script, a static
# UI plus an allowlisted same-origin proxy to hivemind-api, for people who
# hold an agent key. Same image (`hivemind:0.0.0` is the CI sed target);
# the entrypoint skips the migration for this runner, which has no database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-portal
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: portal
spec:
  # Two replicas and a PDB, like the API (ADR 0026): people other than the
  # operator use it, so a deploy or a node drain should not drop it.
  # Stateless (the agent key lives in the browser tab): any replica serves
  # any request.
  replicas: 2
  # maxUnavailable: 0 = the new pod is Ready BEFORE the old one leaves.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
        app.kubernetes.io/component: portal
    spec:
      # No service-link variables: hivemind-* Services would otherwise inject
      # HIVEMIND_*_SERVICE_HOST / _PORT into the env (ADR 0032).
      enableServiceLinks: false
      # Hardening (DEP-4): non-root UID matching the image's USER,
      # RuntimeDefault seccomp, no ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread the two replicas across nodes (preferred, so a one-node
      # cluster still schedules both), as for the API.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hivemind
              app.kubernetes.io/component: portal
      containers:
        - name: app
          image: hivemind:0.0.0
          # Deliberately no envFrom: the shared ConfigMap/Secret carry the
          # DSN and embedder credentials, which this runner must not hold.
          env:
            - name: HIVEMIND_RUNNER
              value: "portal"
            - name: HIVEMIND_HOST
              value: "0.0.0.0"
            - name: HIVEMIND_PORT
              value: "8080"
            # The ONE required setting: where hivemind-api answers.
            - name: HIVEMIND_PORTAL_API_URL
              value: "http://hivemind-api:8000"
            # For an https API URL signed by an internal CA, mount the CA
            # bundle and point at it (empty = the system trust store):
            # - name: HIVEMIND_PORTAL_API_CA_BUNDLE
            #   value: "/etc/hivemind/ca.pem"
            - name: HIVEMIND_LOG_LEVEL
              value: "INFO"
          # The app writes nothing to disk: read-only root, emptyDir /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          # /healthz is the portal's own probe: it answers without calling
          # hivemind-api, so an API outage never restarts this pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
