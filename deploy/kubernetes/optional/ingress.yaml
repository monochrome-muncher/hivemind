# Opt-in external reachability: one nginx Ingress + a cert-manager
# Certificate. Apply via:
#   kubectl kustomize deploy/kubernetes/optional | kubectl apply -f -
#
# Before applying, replace the placeholder host (hivemind.example.org) and
# point the issuer at the org's existing cert-manager issuer (it MUST exist;
# a ClusterIssuer if the name is not a namespace-scoped Issuer).
#
# WHY the SSE annotations: /mcp is a long-lived SSE stream (ADR 0010), and
# nginx's default 60s proxy-read-timeout kills it after a 60s idle gap;
# buffering would stall event delivery. Set Ingress-wide so /mcp is
# covered; harmless for the plain request/response REST path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: ingress
  annotations:
    # --- SSE / long-poll tuning (see above) ---------------------------------
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Cap request bodies at the ingress (DEP-12): an entry is a few KB of
    # text. 1m is nginx's default, stated so it is visible and tunable.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Per-client-IP rate limits (ROADMAP 3.13): unknown keys still cost a
    # credential lookup, so floods stop here (nginx answers 503). Raise them
    # if many agents share one egress IP; `limit-connections` counts open
    # MCP streams too.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hivemind.example.org
      secretName: hivemind-tls
  rules:
    - host: hivemind.example.org
      http:
        paths:
          # Streamable-HTTP MCP (long-lived SSE: needs the annotations above).
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: hivemind-mcp
                port:
                  number: 8088
          # REST API (SPEC §5.1).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
---
# The admin surface (/v1/admin/*, admin-only /v1/metrics) is for operators
# via the admin panel (ADR 0029) or `kubectl port-forward`, never the
# internet. This Ingress takes those paths (nginx picks the longest prefix)
# plus /metrics, the unauthenticated Prometheus target (ADR 0050, scraped
# per pod), and admits only the listed source ranges. The default
# 127.0.0.1/32 admits nobody, so external requests get 403; add operator
# CIDRs comma-separated. Both spellings on purpose: older controllers know
# only `whitelist-`, newer prefer `allowlist-`, and ignoring one would fail
# open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-admin-api
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/allowlist-source-range: "127.0.0.1/32"
    nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hivemind.example.org
      secretName: hivemind-tls
  rules:
    - host: hivemind.example.org
      http:
        paths:
          - path: /v1/admin
            pathType: Prefix
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
          - path: /v1/metrics
            pathType: Exact
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
---
# cert-manager Certificate: the Ingress's tls.secretName (hivemind-tls) is
# minted by the org's cert-manager from this spec.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hivemind-cert
spec:
  secretName: hivemind-tls
  issuerRef:
    # The org's cert-manager issuer must exist (namespace-scoped is fine).
    name: hivemind-issuer
    kind: Issuer
  dnsNames:
    - hivemind.example.org