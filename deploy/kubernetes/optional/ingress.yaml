# Opt-in external reachability: one nginx Ingress + a cert-manager
# Certificate. Apply via:
#   kubectl kustomize deploy/kubernetes/optional | kubectl apply -f -
#
# Replace the placeholder host (hivemind.example.org) with the org's real
# hostname before applying, and point the issuer at the org's existing
# cert-manager issuer (a ClusterIssuer if the name does not resolve to a
# namespace-scoped Issuer — the org's cert-manager issuer MUST exist).
#
# WHY the nginx annotations exist (streamable-HTTP / SSE gotcha):
#   The MCP endpoint (hivemind-mcp) is a LONG-LIVED SSE stream (streamable
#   HTTP, ADR 0010). nginx's DEFAULT proxy-read-timeout is 60s — after a
#   60s idle gap in the stream nginx closes the connection and the MCP
#   session dies mid-conversation. This is the classic nginx-ingress
#   SSE pitfall. The four annotations below keep the stream alive and stop
#   buffering (buffered chunks would stall the event delivery clients rely
#   on). They are set at the Ingress level so the /mcp path is guaranteed
#   covered; the / (REST API) path is a plain request/response service, so
#   the annotations are harmless there (generous timeouts, no buffering).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: ingress
  annotations:
    # --- SSE / long-poll tuning (see the comment block above) ---------------
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Cap request bodies at the ingress (DEP-12): a memory entry is text of a
    # few KB, and the app has no body-size limit of its own. nginx's default
    # is 1m; stated explicitly so it is a visible, tunable decision.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Per-client-IP rate limits (ROADMAP 3.13): an unknown key still costs a
    # credential lookup (and on /mcp a session setup), so a flood of garbage
    # keys is cut off here, before it reaches the app or Postgres. Requests
    # over the limit get 503 from nginx. Raise them if many agents share one
    # egress IP (a NAT): `limit-connections` counts open MCP streams too.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hivemind.example.org
      secretName: hivemind-tls
  rules:
    - host: hivemind.example.org
      http:
        paths:
          # Streamable-HTTP MCP (long-lived SSE — needs the annotations above).
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: hivemind-mcp
                port:
                  number: 8088
          # REST API (SPEC §5.1) — plain request/response; the generous
          # read timeout above is harmless.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
---
# The admin REST surface (/v1/admin/*) is for operators, who reach it through
# the admin panel (ADR 0029: internal ingress or port-forward) or
# `kubectl port-forward`, never from the internet. This second Ingress for the
# same host takes the /v1/admin prefix away from the one above (nginx picks
# the longest matching prefix) and admits only the listed source ranges.
# The default, 127.0.0.1/32, admits nobody from outside, so every external
# request answers 403. To allow an operator network, put its CIDRs here
# (comma-separated). Both annotation spellings are set on purpose: older
# controllers know only `whitelist-`, newer ones prefer `allowlist-`, and a
# controller that ignored the one it does not know would fail open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-admin-api
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/allowlist-source-range: "127.0.0.1/32"
    nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hivemind.example.org
      secretName: hivemind-tls
  rules:
    - host: hivemind.example.org
      http:
        paths:
          - path: /v1/admin
            pathType: Prefix
            backend:
              service:
                name: hivemind-api
                port:
                  number: 8000
---
# cert-manager Certificate: the Ingress's tls.secretName (hivemind-tls) is
# minted by the org's cert-manager from this spec.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hivemind-cert
spec:
  secretName: hivemind-tls
  issuerRef:
    # The org's cert-manager issuer must exist (ADR: cluster-level
    # cert-manager is assumed; a namespace-scoped Issuer is fine too).
    name: hivemind-issuer
    kind: Issuer
  dnsNames:
    - hivemind.example.org