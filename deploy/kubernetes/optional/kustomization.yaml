# OPT-IN kustomization — NOT part of the default build (Ingress + example
# NetworkPolicies).
#
# Apply only when external reachability is needed (the two Services in the
# parent tree are ClusterIP by design):
#
#   kubectl kustomize deploy/kubernetes/optional | kubectl apply -f -
#
# Prerequisites (see DEPLOY.md): the org's nginx-ingress class is installed
# and a cert-manager issuer named `hivemind-issuer` (see optional/ingress.yaml)
# exists in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hivemind
resources:
  - ingress.yaml
  # Example NetworkPolicies (restrict who may reach the pods). Needs a CNI
  # that enforces NetworkPolicy; drop the line if yours does not, or edit the
  # selectors first (see the header of networkpolicy.yaml).
  - networkpolicy.yaml