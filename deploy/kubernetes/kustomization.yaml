# Hivemind production shape: two 2-replica app Deployments against ONE
# Postgres node (ADR 0026).
#
#   kubectl kustomize deploy/kubernetes
#
# Deliberately excluded (DEPLOY.md):
#   * secret-template.yaml (docs only): CI renders `hivemind-secrets` from
#     the K8S_SECRET_* GitLab variables, the single source of truth.
#   * optional/: a separate opt-in kustomization (Ingress + Certificate):
#       kubectl kustomize deploy/kubernetes/optional | kubectl apply -f -
#
# The `hivemind-keys` Secret (ADMIN_KEY / ORG_KEY) comes from the CI
# first-run key bootstrap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hivemind
resources:
  - namespace.yaml
  - configmap.yaml
  - hivemind-api-deployment.yaml
  - hivemind-api-service.yaml
  - hivemind-api-pdb.yaml
  - hivemind-mcp-deployment.yaml
  - hivemind-mcp-service.yaml
  - hivemind-mcp-pdb.yaml