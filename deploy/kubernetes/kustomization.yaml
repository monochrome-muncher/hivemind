# Hivemind — Kubernetes kustomization (production shape, ADR 0007 single-node).
#
#   kubectl kustomize build deploy/kubernetes
#
# Two deliberate exclusions (see DEPLOY.md):
#   * secret-template.yaml ships in-tree for documentation but is NOT listed
#     below: the real `hivemind-secrets` Secret is rendered by the CI deploy
#     job from the masked GitLab variables K8S_SECRET_* (single source of
#     truth = CI, never this tree).
#   * optional/ is a SEPARATE opt-in kustomization (nginx Ingress +
#     cert-manager Certificate) — build/apply it only when external
#     reachability is needed:
#       kubectl kustomize build deploy/kubernetes/optional | kubectl apply -f -
#
# The `hivemind-keys` Secret (ADMIN_KEY / ORG_KEY) is created by the CI
# first-run key bootstrap, also outside this tree.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hivemind
resources:
  - namespace.yaml
  - configmap.yaml
  - hivemind-api-deployment.yaml
  - hivemind-api-service.yaml
  - hivemind-mcp-deployment.yaml
  - hivemind-mcp-service.yaml