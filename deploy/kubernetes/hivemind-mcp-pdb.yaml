# PodDisruptionBudget for `hivemind-mcp` (ADR 0026); see
# hivemind-api-pdb.yaml. The transport is stateless (ADR 0010, SPEC §8.5),
# so losing a pod costs at most ONE in-flight tool call.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hivemind-mcp
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: mcp
