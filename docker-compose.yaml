# docker-compose for local development: Postgres 16 + pgvector, plus a CPU
# vLLM embedding server for a fully local setup (ADR 0005: self-hosted
# embeddings, no data leaves the machine).
#   make pg          -> start the database
#   make vllm        -> start the local vLLM embedding server (:8001)
#   make pg-down     -> stop it
#   make migrate     -> apply migrations
#   make api         -> run the REST API locally
#   make mcp-http    -> start the hostable streamable-HTTP MCP runner (detached docker service, :8088)
#   make test        -> run the test suite (integration tests use this DB)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hivemind
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
    ports:
      - "5432:5432"
    volumes:
      - hivemind-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Local CPU inference embedding server (ADR 0005: self-hosted provider).
  # Official vLLM CPU build, pinned to a release for reproducibility.
  # Serves Qwen/Qwen3-Embedding-0.6B on :8001 (matches the default
  # HIVEMIND_EMBEDDING_ENDPOINT http://localhost:8001/v1).
  #
  # - --runner pooling --convert embed: run the (generative-architecture)
  #   model in embedding mode, exposing /v1/embeddings (OpenAI-compatible).
  # - Qwen3-Embedding-0.6B is Matryoshka (32..1024 dims) but its
  #   config.json does not declare it, so vLLM only honors the
  #   `dimensions` request field once `is_matryoshka` is overridden.
  #   512 is one of the model's trained MRL dimensions and matches
  #   HIVEMIND_EMBEDDING_DIM for this setup.
  # - CPU build needs AVX2 (AVX-512 recommended); x86_64 tag below.
  #   On ARM: use the same tag family's v0.29.0-arm64 instead.
  # - The HF cache volume persists the ~600 MB model download.
  vllm:
    image: vllm/vllm-openai-cpu:v0.29.0-x86_64
    # vLLM's multiprocess IPC needs /dev/shm headroom (64 MiB default is
    # too small); 4 GiB matches the vLLM docker deployment guidance.
    shm_size: "4g"
    command:
      - "--model"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--runner"
      - "pooling"
      - "--convert"
      - "embed"
      - "--hf-overrides"
      - '{"is_matryoshka": true, "matryoshka_dimensions": [32, 64, 128, 256, 512, 768, 1024]}'
      # Despite the flag name, on the CPU backend --gpu-memory-utilization
      # sets the fraction of host RAM vLLM reserves. The default (0.92)
      # fails on a busy dev machine; 0.3 is ample for a 0.6B model and
      # keeps the service from contending with other processes.
      - "--gpu-memory-utilization"
      - "0.3"
    ports:
      - "8001:8000"
    volumes:
      - hivemind-vllm-cache:/root/.cache/huggingface

  # Hostable, multi-agent streamable-HTTP MCP runner (ADR 0010):
  # ONE long-lived process serving an UNLIMITED number of agents, each
  # authenticating PER REQUEST with its own agent-scoped key (ADR 0008).
  # Built from this repo (Dockerfile); reads/writes the shared Postgres
  # pool and embeds via the local vLLM server (ADR 0005).
  #
  # - The container binds 0.0.0.0:8088; the HOST port is 8088 by default
  #   - override with HIVEMIND_MCP_HTTP_PORT (e.g.
  #   `HIVEMIND_MCP_HTTP_PORT=9000 make mcp-http`).
  # - The DSN + embedder point at the SIBLING services on the compose
  #   network (postgres:5432 / vllm:8000), not the host-published ports.
  # - Keys live in the Postgres `credentials` table, so any agent-scoped
  #   key issued via `hivemind-keys issue` works from this service.
  mcp-http:
    build: .
    image: hivemind-mcp-http
    environment:
      HIVEMIND_HOST: "0.0.0.0"
      HIVEMIND_PORT: "8088"
      HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
      HIVEMIND_EMBEDDING_ENDPOINT: http://vllm:8000/v1
      HIVEMIND_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      HIVEMIND_EMBEDDING_DIM: "512"
    ports:
      - "${HIVEMIND_MCP_HTTP_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_started
    healthcheck:
      # The unauthenticated deep-probe endpoint (ADR 0019): 200 = uvicorn
      # is up AND the DB pool answers; 503 = up but the DB is
      # unreachable (degraded); connection-refused = uvicorn has not
      # bound yet. 8088 is the container port (fixed), so this works
      # regardless of the host port mapping.
      test:
        - CMD-SHELL
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8088/mcp/health', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hivemind-pg-data:
  hivemind-vllm-cache: