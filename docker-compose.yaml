# docker-compose for local development: Postgres 16 + pgvector, plus a CPU
# vLLM embedding server for a fully local setup (ADR 0005: self-hosted
# embeddings, no data leaves the machine).
#   make pg          -> start the database
#   make vllm        -> start the local vLLM embedding server (:8001)
#   make pg-down     -> stop it
#   make migrate     -> apply migrations
#   make api         -> run the REST API locally
#   make mcp-http    -> start the hostable streamable-HTTP MCP runner (detached docker service, :8088)
#   make test        -> run the test suite (integration tests use this DB)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hivemind
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
    # Loopback only (DEP-7): the default credentials below are a DEV
    # convenience; never publish this port on a reachable interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hivemind-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Local CPU embedding server (ADR 0005), pinned vLLM CPU build. Serves
  # Qwen/Qwen3-Embedding-0.6B on :8001 (the default
  # HIVEMIND_EMBEDDING_ENDPOINT http://localhost:8001/v1).
  #
  # - --runner pooling --convert embed: expose /v1/embeddings.
  # - The model is Matryoshka (32..1024 dims) but its config.json does not
  #   say so; vLLM honors the `dimensions` field only with the
  #   `is_matryoshka` override. 512 is a trained MRL dimension and matches
  #   HIVEMIND_EMBEDDING_DIM here.
  # - Needs AVX2 (AVX-512 recommended). On ARM use v0.29.0-arm64.
  # - The HF cache volume keeps the ~600 MB model download.
  vllm:
    image: vllm/vllm-openai-cpu:v0.29.0-x86_64
    # vLLM's IPC needs more /dev/shm than the 64 MiB default; 4 GiB per
    # vLLM's docker guidance.
    shm_size: "4g"
    command:
      - "--model"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--runner"
      - "pooling"
      - "--convert"
      - "embed"
      - "--hf-overrides"
      - '{"is_matryoshka": true, "matryoshka_dimensions": [32, 64, 128, 256, 512, 768, 1024]}'
      # On CPU this is the fraction of host RAM vLLM reserves. The 0.92
      # default fails on a busy dev machine; 0.3 is ample for 0.6B.
      - "--gpu-memory-utilization"
      - "0.3"
    # Loopback only (DEP-7): vLLM has no authentication.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - hivemind-vllm-cache:/root/.cache/huggingface

  # Streamable-HTTP MCP runner (ADR 0010): one process serving any number
  # of agents, each authenticating PER REQUEST with its own agent key
  # (ADR 0008), e.g. one from `hivemind-keys issue-agent --name <agent>`.
  #
  # - The host port is published on all interfaces (remote agents must
  #   reach it): put it behind a TLS proxy / firewall. Host port 8088 by
  #   default; override with HIVEMIND_MCP_HTTP_PORT
  #   (`HIVEMIND_MCP_HTTP_PORT=9000 make mcp-http`).
  # - DSN and embedder use the compose service names (postgres:5432 /
  #   vllm:8000), not the host-published ports.
  mcp-http:
    build: .
    image: hivemind-mcp-http
    # Compose's default 10s before SIGKILL is shorter than one embedder
    # attempt. Extraction is OFF here (ADR 0016), so the worst request is
    # the embedder leg: 3 x 10s + 0.5s + 1.0s backoff = 31.5s (ADR 0014).
    # The k8s deployments budget embed+extract (DEPLOY.md §5).
    stop_grace_period: 35s
    environment:
      HIVEMIND_HOST: "0.0.0.0"
      HIVEMIND_PORT: "8088"
      HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
      HIVEMIND_EMBEDDING_ENDPOINT: http://vllm:8000/v1
      HIVEMIND_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      HIVEMIND_EMBEDDING_DIM: "512"
    ports:
      - "${HIVEMIND_MCP_HTTP_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_started
    healthcheck:
      # Shallow readiness endpoint (ADRs 0019, 0037; no DB check). 8088 is
      # the fixed container port, whatever the host mapping.
      test:
        - CMD-SHELL
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8088/mcp/health', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hivemind-pg-data:
  hivemind-vllm-cache: