# Hivemind CI/CD (Kubernetes + GitLab).
#
# Stages: test -> build -> deploy
#   test  : the full suite against a pgvector service container, plus the
#           ADR 0020 migration gates (schema.sql current; previous
#           releases still pass against HEAD's schema)
#   build : docker build + push to the GitLab container registry
#   deploy: kubectl apply via the pre-configured GitLab Kubernetes agent
#
# Required CI/CD variables (see DEPLOY.md):
#   K8S_IMAGE                       registry image prefix, e.g.
#                                   registry.gitlab.com/<group>/<project>/hivemind
#   K8S_SECRET_DATABASE_URL (m,p)     Postgres DSN
#   K8S_SECRET_EMBEDDING_API_KEY (m,p)  embedding credential (may be EMPTY)
#   K8S_SECRET_EXTRACTOR_API_KEY (m,p)  extractor credential (may be EMPTY = off)
#   (m) = Masked, (p) = PROTECTED: an unprotected variable is exposed to MR
#   pipelines whose author controls this very file (DEPLOY.md §1).

workflow:
  # test + build on MRs and the default branch; deploy only on the
  # (protected) default branch.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image:
    name: python:3.14  # the repo pins requires-python >= 3.14
  services:
    # alias: GitLab otherwise derives the hostname from the image name
    # (`pgvector-pgvector`), so `postgres` in the DSN would not resolve.
    - name: pgvector/pgvector:0.8.1-pg16
      alias: postgres
  variables:
    # The service DB user IS a superuser so the probe can CREATE EXTENSION.
    POSTGRES_USER: hivemind
    POSTGRES_PASSWORD: hivemind
    POSTGRES_DB: hivemind
    # 512 keeps the test vectors fast on the fresh CI database.
    HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
    HIVEMIND_EMBEDDING_DIM: "512"
  script:
    - pip install uv==0.12.21
    # The image build uses `uv sync --locked`: fail here, early, when uv.lock
    # is out of date with pyproject.toml.
    - uv lock --check
    - uv sync
    # --- DB readiness probe (REQUIRED) -------------------------------------
    # The integration suite SKIPs when the DB is unreachable, so this probe
    # FAILS the job instead: a skipping suite must never pass as green.
    - |
      uv run python - <<'PYEOF'
      import asyncio, os
      import asyncpg

      dsn = os.environ["HIVEMIND_DATABASE_URL"]

      async def wait_for_db() -> None:
          last = None
          for _ in range(60):
              try:
                  conn = await asyncpg.connect(dsn, timeout=5)
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  await conn.execute("SELECT 1")
                  await conn.close()
                  print("DB probe OK (vector extension ready)")
                  return
              except Exception as exc:
                  last = exc
                  await asyncio.sleep(1)
          raise SystemExit(f"DB probe FAILED after 60s: {last}")

      asyncio.run(wait_for_db())
      PYEOF
    # The full suite, as `make test`: unit, integration and the tests/eval
    # quality gate (SPEC §11). The live-extractor test skips by design
    # (no HIVEMIND_EXTRACTOR_ENDPOINT, ADR 0016).
    - uv run pytest -q

# --- ADR 0020 migration gates ---------------------------------------------
# These need a live pool (the checksum guard is a unit test in `test`).
migrations:
  stage: test
  image:
    name: python:3.14
  services:
    # alias: see the `test` job.
    - name: pgvector/pgvector:0.8.1-pg16
      alias: postgres
  variables:
    POSTGRES_USER: hivemind
    POSTGRES_PASSWORD: hivemind
    POSTGRES_DB: hivemind
    HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
    # 1024, not 512: schema.sql bakes in `vector(<dim>)` at the code
    # default (ADR 0015), or the diff below fails spuriously.
    HIVEMIND_EMBEDDING_DIM: "1024"
    # The backward-compat gate checks out previous releases: full clone.
    GIT_DEPTH: "0"
    COMPAT_RELEASES: "3"
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install uv==0.12.21
    - uv sync
    # 1. The generated schema.sql (a review aid, never applied; ADR 0020)
    #    must be current.
    - uv run hivemind-migrate
    - scripts/dump-schema-reference.sh "$HIVEMIND_DATABASE_URL"
    - |
      if ! git diff --exit-code -- src/hivemind/store/schema.sql; then
        echo "schema.sql is STALE. Run 'make schema-ref' and commit the result."
        exit 1
      fi
    # 2. Expand-and-contract, tested directly: the previous releases'
    #    store tests must pass against HEAD's schema.
    - scripts/check-backward-compat.sh "$HIVEMIND_DATABASE_URL" "$COMPAT_RELEASES"

build:
  stage: build
  image:
    name: docker:27.3.1
    entrypoint: [""]
  services:
    - docker:27.3.1-dind
  variables:
    # Standard GitLab dind wiring (plain TCP, no TLS). A k8s runner needs a
    # dind-capable service; otherwise use the kaniko build below.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # --password-stdin keeps the token out of argv on a shared runner.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$K8S_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
  # --- Alternative: kaniko build (if the k8s runner has no dind) -----------
  # build-kaniko:
  #   stage: build
  #   image:
  #     name: registry.gitlab.com/gitlab-org/images/kaniko/executor
  #   script:
  #     - /kaniko/executor --context="DIR:$(pwd)" --dockerfile=Dockerfile
  #         --destination="$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
  #     # registry auth: the kaniko executor picks up CI_REGISTRY /
  #     # CI_REGISTRY_USER / CI_REGISTRY_PASSWORD (GitLab built-ins).

deploy:
  stage: deploy
  environment:
    name: production
  # One deploy at a time (DEP-11b): no racing on the bootstrap Job / Secret,
  # and no older pipeline applying its image over a newer one.
  resource_group: production
  image:
    # Any pinned image with kubectl, a shell and sed; entrypoint cleared
    # so the runner can start a shell.
    name: alpine/k8s:1.31.0
    entrypoint: [""]
  rules:
    # Deploy only on the (protected) default branch — never from MRs.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - export IMAGE="$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
    # 0) Namespace (created once by an operator, DEPLOY.md §7; a no-op here)
    #    and the ConfigMap, which the bootstrap Job (step 2) reads.
    - kubectl apply -f deploy/kubernetes/namespace.yaml
    - kubectl -n hivemind apply -f deploy/kubernetes/configmap.yaml
    # 1) The app secret from the GitLab variables (CI is their source of
    #    truth). Deliberately NOT `hivemind-keys`, so the keys survive.
    - |
      secret_yaml=$(kubectl -n hivemind create secret generic hivemind-secrets \
        --from-literal=HIVEMIND_DATABASE_URL="$K8S_SECRET_DATABASE_URL" \
        --from-literal=HIVEMIND_EMBEDDING_API_KEY="$K8S_SECRET_EMBEDDING_API_KEY" \
        --from-literal=HIVEMIND_EXTRACTOR_API_KEY="$K8S_SECRET_EXTRACTOR_API_KEY" \
        --from-literal=HIVEMIND_MIGRATE_DATABASE_URL="${K8S_SECRET_MIGRATE_DATABASE_URL:-}" \
        --dry-run=client -o yaml)
      printf '%s\n' "$secret_yaml" | kubectl -n hivemind apply -f -
    # 2) First-run key bootstrap (idempotent, ADR 0044): a one-off Job writes
    #    the admin and org keys into the `hivemind-keys` secret, printing
    #    neither; skipped once it exists. GitLab stays key-free.
    - sh scripts/ci-bootstrap-keys.sh
    # 3) The app manifests; the placeholder `hivemind:0.0.0` is the ONLY
    #    sed target.
    - kubectl kustomize deploy/kubernetes | sed "s|hivemind:0.0.0|$IMAGE|g" | kubectl -n hivemind apply -f -
    # 4) Wait for both rollouts; pods migrate first (ADR 0018), so a dim
    #    mismatch (ADR 0015) blocks the rollout here.
    - kubectl -n hivemind rollout status deployment/hivemind-api --timeout=300s
    - kubectl -n hivemind rollout status deployment/hivemind-mcp --timeout=300s
    # 5) The admin panel (ADR 0029) — its own kustomization so it can also
    #    live in its own project; same image, no Secret, no migration.
    - kubectl kustomize deploy/kubernetes/admin | sed "s|hivemind:0.0.0|$IMAGE|g" | kubectl -n hivemind apply -f -
    - kubectl -n hivemind rollout status deployment/hivemind-admin --timeout=120s
    # kubectl credentials come from the GitLab Kubernetes agent; its
    # ServiceAccount needs the verbs in DEPLOY.md §7. K8S_SECRET_* MUST be
    # Protected (DEPLOY.md §1).
