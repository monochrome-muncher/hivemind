# Hivemind CI/CD (Kubernetes + GitLab).
#
# Stages: test -> build -> deploy
#   test  : hermetic unit suite + Postgres-backed integration suite
#           (pgvector service container; a DB probe fails LOUDLY so a
#           skip-and-pass cannot masquerade as green), plus the two
#           migration gates (ADR 0020): the generated schema.sql
#           reference is current, and the previous releases still work
#           against HEAD's schema (expand-and-contract).
#   build : docker build + push to the GitLab container registry
#   deploy: kubectl apply via the pre-configured GitLab Kubernetes agent
#
# Required CI/CD variables (see DEPLOY.md):
#   K8S_IMAGE                       registry image prefix, e.g.
#                                   registry.gitlab.com/<group>/<project>/hivemind
#   K8S_SECRET_DATABASE_URL (m,p)     Postgres DSN
#   K8S_SECRET_EMBEDDING_API_KEY (m,p)  embedding credential (may be EMPTY)
#   K8S_SECRET_EXTRACTOR_API_KEY (m,p)  extractor credential (may be EMPTY = off)
#   (m) = Masked, (p) = PROTECTED: an unprotected variable is exposed to MR
#   pipelines whose author controls this very file (DEPLOY.md §1).

workflow:
  # test + build on MRs and the default branch; deploy only on the
  # (protected) default branch.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image:
    name: python:3.14  # the repo pins requires-python >= 3.14
  services:
    - pgvector/pgvector:0.8.1-pg16
  variables:
    # The service DB user IS a superuser so the probe can CREATE EXTENSION.
    POSTGRES_USER: hivemind
    POSTGRES_PASSWORD: hivemind
    POSTGRES_DB: hivemind
    # A FRESH CI database provisions at the configured dim (512 keeps the
    # test vectors fast; the dev-machine 512 pool is irrelevant to CI).
    HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
    HIVEMIND_EMBEDDING_DIM: "512"
  script:
    - pip install uv==0.12.21
    - uv sync
    # --- DB readiness probe (REQUIRED) -------------------------------------
    # The integration suite SKIPs when the DB is unreachable, so a broken
    # service container would silently skip-and-pass. This probe waits up to
    # ~60s for the DSN, creates the vector extension as the superuser, and
    # FAILS the job if anything is wrong — a skipping suite must never
    # masquerade as green.
    - |
      uv run python - <<'PYEOF'
      import asyncio, os
      import asyncpg

      dsn = os.environ["HIVEMIND_DATABASE_URL"]

      async def wait_for_db() -> None:
          last = None
          for _ in range(60):
              try:
                  conn = await asyncpg.connect(dsn, timeout=5)
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  await conn.execute("SELECT 1")
                  await conn.close()
                  print("DB probe OK (vector extension ready)")
                  return
              except Exception as exc:
                  last = exc
                  await asyncio.sleep(1)
          raise SystemExit(f"DB probe FAILED after 60s: {last}")

      asyncio.run(wait_for_db())
      PYEOF
    # The live-extractor integration test (tests/integration/test_extractor_live.py)
    # SKIPs by design: HIVEMIND_EXTRACTOR_ENDPOINT is unset (ADR 0016
    # optional extractor). The hermetic + Postgres-backed suite must be green.
    # The FULL suite (matches the repo's `make test` gate): the hermetic
    # unit tests, the Postgres-backed integration suite, and the retrieval
    # eval harness (tests/eval — the golden-set quality gate, SPEC §11).
    - uv run pytest -q

# --- ADR 0020 migration gates ---------------------------------------------
# The migration-file checksum guard is a plain unit test
# (tests/unit/test_migration_chain.py) and runs in `test` above. These two
# need a live pool, so they get their own job.
migrations:
  stage: test
  image:
    name: python:3.14
  services:
    - pgvector/pgvector:0.8.1-pg16
  variables:
    POSTGRES_USER: hivemind
    POSTGRES_PASSWORD: hivemind
    POSTGRES_DB: hivemind
    HIVEMIND_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
    # 1024, NOT the 512 the `test` job uses: the committed schema.sql
    # reference bakes the dim into `vector(<dim>)`, so it has to be
    # regenerated at the code default (ADR 0015) or the diff below
    # fails for a reason that has nothing to do with the schema.
    HIVEMIND_EMBEDDING_DIM: "1024"
    # The backward-compat gate checks out previous releases into git
    # worktrees, so the default shallow clone is not enough.
    GIT_DEPTH: "0"
    COMPAT_RELEASES: "3"
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install uv==0.12.21
    - uv sync
    # 1. The generated schema.sql reference must be current. It is a
    #    review aid, never applied (ADR 0020) — but a stale one is a
    #    misleading review aid, so regenerate and diff.
    - uv run hivemind-migrate
    - scripts/dump-schema-reference.sh "$HIVEMIND_DATABASE_URL"
    - |
      if ! git diff --exit-code -- src/hivemind/store/schema.sql; then
        echo "schema.sql is STALE. Run 'make schema-ref' and commit the result."
        exit 1
      fi
    # 2. Expand-and-contract: the previous releases' store tests must
    #    pass against HEAD's schema. This tests the property directly
    #    rather than grepping migrations for DROP COLUMN / ALTER /
    #    RENAME, which in correct expand-and-contract are routine.
    - scripts/check-backward-compat.sh "$HIVEMIND_DATABASE_URL" "$COMPAT_RELEASES"

build:
  stage: build
  image:
    name: docker:27.3.1
    entrypoint: [""]
  services:
    - docker:27.3.1-dind
  variables:
    # Standard GitLab docker-in-docker (dind) wiring. CAVEAT: a k8s runner
    # needs a dind-capable service (or privileged pods for /dev/shm); if the
    # org's runner cannot run dind, use the commented-out kaniko build below.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # docker:27: log into the GitLab container registry (CI_REGISTRY_* is
    # provided by GitLab for the project's registry).
    # --password-stdin keeps the token out of argv (visible to other
    # processes on a shared runner).
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$K8S_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
  # --- Alternative: kaniko build (if the k8s runner has no dind) -----------
  # build-kaniko:
  #   stage: build
  #   image:
  #     name: registry.gitlab.com/gitlab-org/images/kaniko/executor
  #   script:
  #     - /kaniko/executor --context="DIR:$(pwd)" --dockerfile=Dockerfile
  #         --destination="$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
  #     # registry auth: the kaniko executor picks up CI_REGISTRY /
  #     # CI_REGISTRY_USER / CI_REGISTRY_PASSWORD (GitLab built-ins).

deploy:
  stage: deploy
  environment:
    name: production
  # One deploy at a time (DEP-11b): two fast pushes must not race on the
  # bootstrap Job / Secret, and an older pipeline finishing later must not
  # `apply` its older image over the newer one.
  resource_group: production
  image:
    # kubectl + a POSIX/bash shell + sed. Any image with those works (the
    # org's standard kubectl image is fine); pin a version, never a floating tag.
    # The entrypoint is cleared so the GitLab runner can start a shell.
    name: alpine/k8s:1.31.0
    entrypoint: [""]
  rules:
    # Deploy only on the (protected) default branch — never from MRs.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - export IMAGE="$K8S_IMAGE:$CI_COMMIT_SHORT_SHA"
    # 0) The namespace and the ConfigMap. The namespace is created ONCE by
    #    an operator (DEPLOY.md §7); applying it here is a no-op that only
    #    needs get/patch on that one namespace. The ConfigMap must exist
    #    before the key-bootstrap Job (step 2), which reads the embedding dim
    #    from it (applied again, unchanged, by the kustomize tree in step 3).
    - kubectl apply -f deploy/kubernetes/namespace.yaml
    - kubectl -n hivemind apply -f deploy/kubernetes/configmap.yaml
    # 1) Create/refresh the app secret from the masked+protected GitLab
    #    variables. CI is the single source of truth for these three values;
    #    the bootstrap-owned `hivemind-keys` secret is a DELIBERATELY
    #    DIFFERENT secret so this never wipes the generated keys.
    - |
      secret_yaml=$(kubectl -n hivemind create secret generic hivemind-secrets \
        --from-literal=HIVEMIND_DATABASE_URL="$K8S_SECRET_DATABASE_URL" \
        --from-literal=HIVEMIND_EMBEDDING_API_KEY="$K8S_SECRET_EMBEDDING_API_KEY" \
        --from-literal=HIVEMIND_EXTRACTOR_API_KEY="$K8S_SECRET_EXTRACTOR_API_KEY" \
        --dry-run=client -o yaml)
      printf '%s\n' "$secret_yaml" | kubectl -n hivemind apply -f -
    # 2) FIRST-RUN KEY BOOTSTRAP (idempotent; scripts/ci-bootstrap-keys.sh +
    #    deploy/kubernetes/bootstrap/keys-job.yaml). On a FRESH database no
    #    admin / org keys exist yet; a one-off Job in the app image prints
    #    them once, and the script stores them in the `hivemind-keys` secret.
    #    On every later deploy the secret exists and this is skipped. The raw
    #    keys live ONLY in the k8s Secret — GitLab stays key-free by design.
    - sh scripts/ci-bootstrap-keys.sh
    # 3) Apply the app manifests: the placeholder image `hivemind:0.0.0` in
    #    deploy/kubernetes/ is the ONLY sed target (kustomize is built into
    #    kubectl — no extra binary needed).
    - kubectl kustomize deploy/kubernetes | sed "s|hivemind:0.0.0|$IMAGE|g" | kubectl -n hivemind apply -f -
    # 4) Wait for both rollouts (each pod's entrypoint runs the
    #    idempotent migration first (ADR 0018) — a dim mismatch (ADR 0015)
    #    blocks the rollout LOUDLY here, never a silent runtime no-op).
    - kubectl -n hivemind rollout status deployment/hivemind-api --timeout=300s
    - kubectl -n hivemind rollout status deployment/hivemind-mcp --timeout=300s
    # 5) The admin panel (ADR 0029) — its own kustomization so it can also
    #    live in its own project; same image, no Secret, no migration.
    - kubectl kustomize deploy/kubernetes/admin | sed "s|hivemind:0.0.0|$IMAGE|g" | kubectl -n hivemind apply -f -
    - kubectl -n hivemind rollout status deployment/hivemind-admin --timeout=120s
    # KUBECTL AUTH: the GitLab Kubernetes agent (pre-configured per org)
    # provides the kubectl credentials for this job — no kubeconfig wiring
    # here. The agent's ServiceAccount needs the verbs in DEPLOY.md §7.
    # The K8S_SECRET_* variables MUST be Protected (DEPLOY.md §1), so they
    # are only injected into pipelines on protected branches.
