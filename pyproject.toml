[project]
name = "hivemind"
version = "1.0.0rc1"
description = "Hivemind — a shared memory service for an organization's AI agents, backed by PostgreSQL + pgvector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
hivemind-api = "hivemind.api.main:run"
hivemind-mcp = "hivemind.mcp.server:main"
hivemind-mcp-pg = "hivemind.mcp.server:main_pg"
hivemind-mcp-http = "hivemind.mcp.http:main_http"
hivemind-migrate = "hivemind.store.migrate:main"
hivemind-keys = "hivemind.store.keys:main"
hivemind-admin = "hivemind.admin.main:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["hivemind"]
explicit_package_bases = true

# asyncpg, pgvector and yoyo ship no py.typed markers; silence the
# missing-stub import errors for these third-party packages (the rest of the
# codebase stays fully type-checked).
[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "yoyo.*"]
ignore_missing_imports = true

# The migration chain is data, not library code: each file is exec'd by yoyo
# with `step` injected, they are never imported by the package, and applied
# migrations are frozen (CI pins their hashes) so they cannot be refactored
# to satisfy a checker.
[[tool.mypy.overrides]]
module = ["hivemind.store.migrations.*"]
ignore_errors = true