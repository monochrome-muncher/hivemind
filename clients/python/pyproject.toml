[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemind-memory"
version = "2.33.1"
description = "Async client for Hivemind, the shared memory service for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["agents", "memory", "mcp", "hivemind"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx2>=2.14",
    "exceptiongroup>=1.2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/monochrome-muncher/hivemind/tree/main/clients/python"
Source = "https://github.com/monochrome-muncher/hivemind"
Issues = "https://github.com/monochrome-muncher/hivemind/issues"
Changelog = "https://github.com/monochrome-muncher/hivemind/blob/main/plugins/hivemind/CHANGELOG.md"

[project.optional-dependencies]
langchain = ["langchain-core>=1.3.3,<2"]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "langchain-core>=1.3.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
